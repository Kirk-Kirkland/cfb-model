name: Publish weekly picks

on:
  schedule:
    # Times below are ET during EDT (UTC-4, through ~Nov 1); they'll run an hour
    # later by the clock once EST (UTC-5) kicks in.
    # Sun 12:00 ET (16:00 UTC) - main picks run, full week ahead
    - cron: '0 16 * * 0'
    # Thu 09:00 ET (13:00 UTC) - main picks run, fresh lines/injuries ahead of
    # Thursday-night games
    - cron: '0 13 * * 4'
    # Sat 08:00 ET (12:00 UTC) - weather refresh (still a full run; catches
    # wind/rain shifts close to kickoff, not meant to redefine the week's picks)
    - cron: '0 12 * * 6'
  workflow_dispatch:
    inputs:
      week:
        description: 'Force a specific week (optional)'
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python web/publish.py --season 2026 --week "${{ github.event.inputs.week }}" --injuries data/injuries.json
          else
            python web/publish.py --season 2026 --injuries data/injuries.json
          fi

      - name: Commit and push
        run: |
          git config user.name "cfb-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json data/history
          git diff --staged --quiet || git commit -m "Publish picks: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
